name: Release check

# Packaging breaks from changes nobody thinks of as release changes. This runs the whole installer matrix, including
# the install checks on each runner, without publishing anything, on every push to main that touches the Publisher,
# its manifest, the server project, the artwork, the license, the version, or the workflows, so a broken installer
# shows up on the push instead of on release day.

on:
  push:
    branches: [main]
    paths:
      - "src/Less3.Publisher/**"
      - "src/Directory.Build.props"
      - "src/Less3/Less3.csproj"
      - "src/Less3/Program.cs"
      - "src/Less3.Dashboard/**"
      - "dashboard/next.config.mjs"
      - "dashboard/package.json"
      - "dashboard/package-lock.json"
      - "publisher.json"
      - "assets/logo-1024.png"
      - "LICENSE.md"
      - "build-installers.*"
      - ".github/release-install-notes.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  installers:
    uses: ./.github/workflows/release.yml
