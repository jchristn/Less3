name: Release

# Builds the Less3 and Less3 Dashboard installers on each operating system's own runner and, on a v<version> tag, publishes them together
# as one GitHub Release. publisher.json is the source of truth and src/Less3.Publisher does the packaging; the same
# Publisher commands run locally through build-installers.sh and build-installers.bat.
#
#   Tag push (v4.1.3):    build every installer, then the release job checks the tag and CHANGELOG.md and publishes.
#   Manual run:           build every installer and upload them as workflow artifacts; nothing is published.
#   release-check.yml:    calls this workflow on pushes to main that touch packaging, also without publishing.
#
# Fan out, then fan in: nothing is published until all three operating systems have built and passed their install
# checks, and a failure on one publishes nothing. The package-manager jobs run after the release, only on a tag, and
# only when the repository variable ENABLE_PACKAGE_MANAGERS is "true".
#
# Less3 is not code-signed, by policy (see INSTALL.md). macOS bundles are ad-hoc signed by the Publisher.
# Set the repository variable RELEASE_DRAFT to "true" to create the release as a draft instead of publishing it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the setup .exe and .zip files
        run: dotnet run --project src/Less3.Publisher -c Release -- --channel inno,archive --output artifacts
      - name: Install, run, and uninstall the x64 setups
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Test-Setup([string]$Name, [string]$DisplayName, [string]$Exe, [string]$Launcher, [string[]]$Arguments, [hashtable]$Environment, [string]$Url) {
            $setup = Get-ChildItem artifacts -Filter "$Name-*-win-x64-setup.exe" | Select-Object -First 1
            Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
            $app = Join-Path $env:ProgramFiles $DisplayName
            foreach ($file in $Exe, $Launcher, 'LICENSE.txt') { if (-not (Test-Path (Join-Path $app $file))) { throw "Missing $file in $app" } }
            $path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            if (($path -split ';') -notcontains $app) { throw "The installer did not add $app to the system PATH." }
            if (-not (Test-Path (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\$DisplayName\$DisplayName.lnk"))) { throw "The $DisplayName Start menu shortcut is missing." }
            $work = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "$Name-run")
            foreach ($key in $Environment.Keys) { Set-Item -Path "Env:$key" -Value $Environment[$key] }
            $start = @{ FilePath = (Join-Path $app $Exe); WorkingDirectory = $work; PassThru = $true; RedirectStandardOutput = (Join-Path $work 'out.log'); RedirectStandardError = (Join-Path $work 'err.log') }
            if ($Arguments.Count -gt 0) { $start.ArgumentList = $Arguments }
            $server = Start-Process @start
            $status = 0
            for ($i = 0; $i -lt 60 -and $status -ne 200; $i++) { Start-Sleep 1; try { $status = (Invoke-WebRequest -UseBasicParsing $Url).StatusCode } catch { } }
            Stop-Process -Id $server.Id -Force
            Get-Process -Name node -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($status -ne 200) { Get-Content (Join-Path $work 'out.log'), (Join-Path $work 'err.log'); throw "$Exe did not answer at $Url (status $status)." }
            Write-Host "$Exe answered 200 at $Url."
            Start-Sleep 2
            Start-Process -Wait -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
            $path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            if (($path -split ';') -contains $app) { throw "The uninstaller left $app on the system PATH." }
            if (Test-Path (Join-Path $app $Exe)) { throw "The uninstaller left $Exe behind." }
            Write-Host "${DisplayName}: install, PATH, Start menu entry, run, and uninstall all checked."
          }
          Test-Setup 'less3' 'Less3' 'less3.exe' 'start-less3.cmd' @() @{ DOTNET_RUNNING_IN_CONTAINER = 'true'; LESS3_PORT = '18000' } 'http://localhost:18000/'
          Test-Setup 'less3-dashboard' 'Less3 Dashboard' 'less3-dashboard.exe' 'start-less3-dashboard.cmd' @('--port', '13000') @{} 'http://127.0.0.1:13000/'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            artifacts/*.exe
            artifacts/*.zip
          if-no-files-found: error

  macos:
    name: macOS installers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the .pkg, .dmg, and .tar.gz files
        run: dotnet run --project src/Less3.Publisher -c Release -- --channel macos,archive --output artifacts
      - name: Check the ad-hoc signatures
        run: |
          for dmg in artifacts/*.dmg; do
            mount="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'\t' '{print $NF}')"
            app="$(find "$mount" -maxdepth 1 -name '*.app' | head -1)"
            name="$(basename "$app" .app)"
            codesign --verify --deep --strict --verbose=2 "$app"
            test -f "$mount/If $name won't open.txt"
            hdiutil detach -quiet "$mount"
          done
          for archive in artifacts/*.tar.gz; do
            dir="$(mktemp -d)"; tar xzf "$archive" -C "$dir"
            for exe in "$dir"/*/less3 "$dir"/*/less3-dashboard; do [ -f "$exe" ] && codesign --verify --strict --verbose=2 "$exe"; done
          done
      - name: Install, run, and uninstall the .pkg files
        run: |
          case "$(uname -m)" in arm64) arch=osx-arm64 ;; *) arch=osx-x64 ;; esac
          wait_for() {
            for i in $(seq 1 60); do curl -fs -o /dev/null "$1" && return 0; sleep 1; done
            return 1
          }
          sudo installer -pkg artifacts/less3-4*-"$arch".pkg -target /
          sudo installer -pkg artifacts/less3-dashboard-*-"$arch".pkg -target /
          test -x /Applications/Less3.app/Contents/MacOS/less3
          test -x /Applications/Less3.app/Contents/MacOS/start-less3
          test "$(readlink /usr/local/bin/less3)" = /Applications/Less3.app/Contents/MacOS/less3
          test -x "/Applications/Less3 Dashboard.app/Contents/MacOS/less3-dashboard"
          test -x "/Applications/Less3 Dashboard.app/Contents/Resources/node/node"
          test -f "/Applications/Less3 Dashboard.app/Contents/Resources/app/server.js"
          test "$(readlink /usr/local/bin/less3-dashboard)" = "/Applications/Less3 Dashboard.app/Contents/MacOS/less3-dashboard"
          codesign --verify --deep --strict /Applications/Less3.app
          codesign --verify --deep --strict "/Applications/Less3 Dashboard.app"
          work="$(mktemp -d)"; cd "$work"
          DOTNET_RUNNING_IN_CONTAINER=true LESS3_PORT=18000 less3 > less3.log 2>&1 < /dev/null &
          server=$!
          less3-dashboard --port 13000 > dashboard.log 2>&1 < /dev/null &
          dashboard=$!
          ok=1
          wait_for http://localhost:18000/ || { cat less3.log; echo "::error::less3 did not answer"; ok=0; }
          wait_for http://127.0.0.1:13000/ || { cat dashboard.log; echo "::error::less3-dashboard did not answer"; ok=0; }
          kill "$server" "$dashboard" || true
          sleep 2
          if lsof -ti tcp:13000 >/dev/null; then echo "::error::the dashboard's Node.js process outlived less3-dashboard"; ok=0; fi
          [ "$ok" = 1 ] || exit 1
          echo "less3 and less3-dashboard answered 200."
          sudo /Applications/Less3.app/Contents/Resources/uninstall.sh
          sudo "/Applications/Less3 Dashboard.app/Contents/Resources/uninstall.sh"
          test ! -e /Applications/Less3.app
          test ! -e "/Applications/Less3 Dashboard.app"
          test ! -e /usr/local/bin/less3
          test ! -e /usr/local/bin/less3-dashboard
          for id in ai.latticetech.less3.pkg ai.latticetech.less3.dashboard.pkg; do
            if pkgutil --pkg-info "$id" >/dev/null 2>&1; then echo "::error::The installer receipt $id is still registered."; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: |
            artifacts/*.pkg
            artifacts/*.dmg
            artifacts/*.tar.gz
          if-no-files-found: error

  linux:
    name: Linux installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install --no-document fpm
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build the .deb, .rpm, AppImage, and .tar.gz files
        run: dotnet run --project src/Less3.Publisher -c Release -- --channel debrpm,appimage,archive --output artifacts
      - name: Check the packages
        run: |
          for deb in artifacts/*.deb; do dpkg-deb --info "$deb" | grep -E 'Package|Version|Architecture|Depends'; dpkg-deb --contents "$deb" | grep -E 'usr/bin/less3|\.service|hicolor/256|start-less3'; done
          for rpm in artifacts/*.rpm; do rpm -qip "$rpm" | grep -E 'Name|Version|Architecture'; rpm -qlp "$rpm" | grep -E 'usr/bin/less3|\.service'; done
          chmod +x artifacts/*.AppImage
          for image in artifacts/less3-4*-x86_64.AppImage artifacts/less3-dashboard-*-x86_64.AppImage; do
            dir="$(mktemp -d)"; (cd "$dir" && "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null)
            test -x "$dir/squashfs-root/AppRun"
            ls "$dir/squashfs-root/usr/bin"
          done
          dir="$(mktemp -d)"; (cd "$dir" && "$GITHUB_WORKSPACE"/artifacts/less3-dashboard-*-x86_64.AppImage --appimage-extract >/dev/null)
          test -x "$dir/squashfs-root/usr/bin/node/node"
          test -f "$dir/squashfs-root/usr/bin/app/server.js"
      - name: Install, run, and remove the .deb files
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          wait_for() {
            for i in $(seq 1 60); do curl -fs -o /dev/null "$1" && return 0; sleep 1; done
            return 1
          }
          sudo apt-get install -y ./artifacts/less3_*_amd64.deb ./artifacts/less3-dashboard_*_amd64.deb
          test "$(command -v less3)" = /usr/bin/less3
          test "$(command -v less3-dashboard)" = /usr/bin/less3-dashboard
          id less3
          id less3-dashboard
          test -d /var/lib/less3
          test "$(stat -c %U /var/lib/less3)" = less3
          systemctl cat less3.service
          systemctl cat less3-dashboard.service
          test "$(systemctl is-enabled less3.service || true)" = disabled
          test "$(systemctl is-enabled less3-dashboard.service || true)" = disabled
          work="$(mktemp -d)"; cd "$work"
          DOTNET_RUNNING_IN_CONTAINER=true LESS3_PORT=18000 less3 > less3.log 2>&1 < /dev/null &
          server=$!
          ok=1
          wait_for http://localhost:18000/ || { cat less3.log; echo "::error::less3 did not answer"; ok=0; }
          kill "$server" || true
          # The dashboard as its service runs it: as the less3-dashboard account, from the read-only install folder.
          sudo systemctl start less3-dashboard.service
          wait_for http://127.0.0.1:3000/ || { sudo journalctl -u less3-dashboard --no-pager; echo "::error::the less3-dashboard service did not answer"; ok=0; }
          sudo systemctl stop less3-dashboard.service
          sleep 2
          if ss -ltn | grep -q ':3000 '; then echo "::error::the dashboard's Node.js process outlived the service"; ok=0; fi
          [ "$ok" = 1 ] || exit 1
          echo "less3 and the less3-dashboard service answered 200."
          sudo apt-get remove -y less3 less3-dashboard
          test ! -e /usr/bin/less3
          test ! -e /usr/bin/less3-dashboard
          test ! -e /usr/lib/systemd/system/less3.service
          test ! -e /usr/lib/systemd/system/less3-dashboard.service
          test -d /var/lib/less3
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          props_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props | head -n 1)"
          if [ "$tag_version" != "$props_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$props_version</Version> in src/Directory.Build.props."
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          case "$tag_version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
      - name: Build the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section. Add one before tagging."
            exit 1
          fi
          # Relative links in CHANGELOG.md point at repository files; on the release page they must point at the tag.
          sed -E "s|\]\(([^)h#][^):]*)\)|](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/\1)|g" changes.md > changes-linked.md
          # An optional .github/highlights/<version>.md (a "## Highlights" section) goes above the changelog.
          {
            sed "s/{version}/$VERSION/g" .github/release-install-notes.md
            if [ -f ".github/highlights/$VERSION.md" ]; then echo; cat ".github/highlights/$VERSION.md"; fi
            echo; echo "## What's changed"; echo; cat changes-linked.md
          } > release-notes.md
          if grep -q '{version}' release-notes.md; then echo "::error::release-notes.md still contains {version}."; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: installers-*
          merge-multiple: true
      - name: Stage the assets and write SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Not "assets": that is the repository's own artwork folder, already checked out here.
          mkdir -p release-assets
          find downloads -type f -exec cp {} release-assets/ \;
          cd release-assets
          expected=""
          for name in less3 less3-dashboard; do
            expected="$expected $name-$VERSION-win-x64-setup.exe $name-$VERSION-win-arm64-setup.exe $name-$VERSION-win-x64.zip $name-$VERSION-win-arm64.zip
            $name-$VERSION-osx-x64.pkg $name-$VERSION-osx-arm64.pkg $name-$VERSION-osx-x64.dmg $name-$VERSION-osx-arm64.dmg $name-$VERSION-osx-x64.tar.gz $name-$VERSION-osx-arm64.tar.gz
            ${name}_${VERSION}_amd64.deb ${name}_${VERSION}_arm64.deb $name-$VERSION-1.x86_64.rpm $name-$VERSION-1.aarch64.rpm
            $name-$VERSION-x86_64.AppImage $name-$VERSION-aarch64.AppImage $name-$VERSION-linux-x64.tar.gz $name-$VERSION-linux-arm64.tar.gz"
          done
          missing=0
          for file in $expected; do [ -f "$file" ] || { echo "::error::Missing $file"; missing=1; }; done
          [ "$missing" = 0 ] || exit 1
          count="$(ls | wc -l)"
          if [ "$count" != 36 ]; then echo "::error::Expected 36 assets, found $count:"; ls; exit 1; fi
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Less3 ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          draft: ${{ vars.RELEASE_DRAFT == 'true' }}

  linux-repos:
    name: apt and yum repositories
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PACKAGE_MANAGERS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install repository tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update -y && sudo apt-get install -y dpkg-dev apt-utils createrepo-c gnupg
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux
          path: artifacts
      - name: Import the GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then echo "::warning::GPG_PRIVATE_KEY is not set; the repository metadata will be unsigned and apt and dnf will refuse it."; exit 0; fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Build the repository metadata
        run: dotnet run --project src/Less3.Publisher -c Release -- --channel aptyum --output artifacts
      - name: Publish the repositories to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/repo
          keep_files: true

  package-managers:
    name: Package-manager manifests
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PACKAGE_MANAGERS == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true
      - name: Generate the winget, Scoop, and Homebrew manifests
        run: dotnet run --project src/Less3.Publisher -c Release -- --channel winget,scoop,brew --output artifacts
      - name: Commit the Scoop bucket and Homebrew formula to this repository
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p bucket Formula
          cp artifacts/manifests/scoop/*.json bucket/
          cp artifacts/manifests/brew/*.rb Formula/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket Formula
          git diff --cached --quiet || { git commit -m "Package manifests for $VERSION" && git push origin HEAD:main; }
      - uses: actions/upload-artifact@v4
        with:
          name: package-manager-manifests
          path: artifacts/manifests/**
      - name: Report what still needs a person
        run: |
          echo "::notice::winget: submit artifacts/manifests/winget to microsoft/winget-pkgs (WINGET_TOKEN); the pull request needs a merge."
          echo "::notice::Scoop and Homebrew: committed to bucket/ and Formula/ in this repository."

  chocolatey:
    name: Chocolatey package
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_PACKAGE_MANAGERS == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: installers-windows
          path: artifacts
      - name: Generate the package sources
        run: dotnet run --project src/Less3.Publisher -c Release -- --channel choco --output artifacts
      - name: Pack and push
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          foreach ($nuspec in Get-ChildItem artifacts/manifests/choco -Filter '*.nuspec') { choco pack $nuspec.FullName --outputdirectory artifacts/choco }
          if (-not $env:CHOCO_API_KEY) { Write-Host "::warning::CHOCO_API_KEY is not set; the packages were packed but not pushed (pending)."; exit 0 }
          foreach ($package in Get-ChildItem artifacts/choco -Filter '*.nupkg') { choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY }
