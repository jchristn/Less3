worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream less3_nodes {
        least_conn;
        server less3-node1:8000 max_fails=3 fail_timeout=10s;
        server less3-node2:8000 max_fails=3 fail_timeout=10s;
    }

    # Large uploads: do not cap the body size, and give assembly time on multipart complete.
    client_max_body_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    server {
        listen 8000;

        location / {
            proxy_pass http://less3_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Retry ONLY on connection-level failures, and - because "non_idempotent" is NOT set -
            # nginx will never replay a POST/PUT/DELETE on a second node. This is what prevents a
            # timed-out mutation from being duplicated across nodes (see archive/MULTINODE_PLAN.md R11).
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
