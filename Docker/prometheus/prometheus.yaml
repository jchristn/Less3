global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Each Less3 node serves Watson's HTTP/server metrics on /metrics on its main port (8000),
  # reachable across the Docker network. This is where the per-node request rate, latency, status,
  # and up signals come from.
  - job_name: 'less3-nodes'
    metrics_path: /metrics
    static_configs:
      - targets: ['less3-node1:8000', 'less3-node2:8000']
        labels:
          service: 'less3'

  # The OpenTelemetry collector re-exports the Less3.* domain metrics (locks, fencing conflicts,
  # storage, multipart, cleanup) that each node pushes over OTLP, one series per node via the
  # service_instance_id label. Watson's meter is NOT exported over OTLP, so there is no duplication
  # with the direct node scrape above.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
